  <script>

    // Set the target date to 50 days from now (including current time)
    let countdownDate = new Date();
    countdownDate.setDate(countdownDate.getDate() + 50);

    // Update the countdown every 1 second
    let countdownInterval = setInterval(function () {
      let now = new Date().getTime();
      let timeDifference = countdownDate - now;

      // Time calculations for days, hours, minutes, and seconds
      let days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
      let hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      let minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
      let seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

      // Display the result in the corresponding HTML elements
      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
      document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
      document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

      // If the countdown is over, display a message
      if (timeDifference < 0) {
        clearInterval(countdownInterval);
        document.querySelector(".comming-soon-item").innerHTML = "<h2 class='title'>We're Here!</h2>";
      }
    }, 1000);

  </script>
